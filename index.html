<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>
    Leyendas de Santa Cruz - Experiencia Inmersiva
  </title>


  <!-- A-FRAME -->

  <script
    src="https://aframe.io/releases/1.4.2/aframe.min.js">
  </script>


  <!-- CSS -->

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body>


  <!-- =====================================================
       CONTENEDOR PRINCIPAL
       ===================================================== -->

  <div class="contenedor-principal">


    <!-- ===================================================
         PARTE SUPERIOR
         =================================================== -->

    <header class="seccion-superior">


      <div class="panel-izquierdo">

        <img
          src="/logo.png"
          alt="Logo Leyendas"
          id="logo-principal"
        >

      </div>


      <div class="panel-derecho-imagen">

      </div>


    </header>



    <!-- ===================================================
         PARTE INFERIOR
         =================================================== -->

    <main class="seccion-inferior">


      <!-- =================================================
           MENÚ
           ================================================= -->

      <aside
        class="sidebar-verde"
        id="sidebar"
      >

        <button
          id="btn-menu"
          type="button"
        >
          ≡
        </button>


        <nav id="menu-leyendas">


          <button
            id="btn-leyenda-1"
            type="button"
          >

            La Leyenda del Carretón

          </button>


          <button
            id="btn-leyenda-2"
            type="button"
          >

            El Guajojó

          </button>


        </nav>

      </aside>



      <!-- =================================================
           CONTENIDO
           ================================================= -->

      <section
        class="area-texto"
        id="contenido-dinamico"
      >


        <h2>
          Patio de los Abuelos
        </h2>


        <p>
          Bienvenido al núcleo de nuestras tradiciones.
          Escucha, observa y vive las historias.
        </p>


      </section>


    </main>


  </div>



  <!-- =====================================================
       SCRIPT PRINCIPAL
       ===================================================== -->

  <script
    type="module"
    src="/main.js"
  ></script>


</body>

</html>
