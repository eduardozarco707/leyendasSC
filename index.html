<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leyendas de Santa Cruz - Experiencia Inmersiva</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <div class="contenedor-principal">
      
      <!-- SECCIÓN SUPERIOR -->
      <header class="seccion-superior">
        <div class="panel-izquierdo">
          <img src="/logo.png" alt="Logo Leyendas" id="logo-principal">
        </div>

        <div class="panel-derecho-imagen">
        </div>
      </header>

      <!-- SECCIÓN INFERIOR -->
      <main class="seccion-inferior">
        
        <aside class="sidebar-verde" id="sidebar">
          <button id="btn-menu">≡</button>
          
          <nav id="menu-leyendas">
            <button id="btn-leyenda-1">La Leyenda del Carretón</button>
            <button id="btn-leyenda-2">El Guajojó</button>
          </nav>
        </aside>

        <section class="area-texto" id="contenido-dinamico">
          <h2>Patio de los Abuelos</h2>
          <p>Bienvenido al núcleo de nuestras tradiciones. Escucha, observa y vive las historias.</p>
        </section>

      </main>

    </div>
    
    <script type="module" src="/main.js"></script>
  </body>
</html>
